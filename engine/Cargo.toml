[package]
name = "folio_draw_engine"
version = "0.1.0"
edition = "2021"
description = "Folio Draw native engine: layers, brushes, shapes, selection, undo and from-scratch PNG/BMP/ZIP/OpenRaster codecs"
license = "MIT"

# Deliberately zero third-party dependencies: every codec and raster routine is written here.
[dependencies]

[lib]
name = "folio_draw_engine"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
